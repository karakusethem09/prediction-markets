# Makes the folders in src/ (extract, transform, ...) importable from anywhere:
# scripts, tests, notebooks and the dashboard. Install once with: pip install -e .
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-markets"
version = "0.1.0"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]
