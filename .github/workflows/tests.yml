# Run every test on each push and pull request, so a change is checked before it reaches main.
# The daily update workflow (pipeline.yml) calls this same file before it updates any data.
name: Tests

on:
  push:
  pull_request:
  workflow_call:  # lets pipeline.yml reuse these steps instead of keeping its own copy

permissions:
  contents: read  # the workflow only reads the code

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:  # a throwaway database just for the tests
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prediction_markets
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q -rs  # -rs lists any skipped test and why, right in the log
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prediction_markets
          REQUIRE_DATABASE: "1"  # if the database is missing, fail instead of skipping database tests
